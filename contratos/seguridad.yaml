  /api/logs/opciones:
    get:
      tags: [logs]
      operationId: opcionesLogs
      summary: Opciones de los filtros de Logs
      description: |
        Igual que `GET /api/logs/opciones` del monolito (`auditoria/ControladorLogs`). `usuarios` son todos los usuarios, incluidos los
        inactivos: la bitácora conserva su historia. `correoDefecto` es `""` si no está configurado.
      security:
        - sesionGateway: []
      responses:
        '200':
          description: Opciones.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpcionesLogs'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermisoLogs'
  /api/logs:
    get:
      tags: [logs]
      operationId: listarLogs
      summary: Logs del sistema, por páginas de 100
      description: |
        Igual que el monolito. Siempre se consulta por un rango de fechas en hora de Bogotá; sin fechas, los últimos 7 días hasta hoy. Si
        las fechas vienen invertidas, se intercambian. Con `texto`, el periodo es de máximo 92 días. El orden va de lo más reciente a lo más
        antiguo; la página siguiente se pide con `despuesFecha` y `despuesId` tomados de `siguiente`.

        422: «La página pedida no es válida.» · «Para buscar por texto, use un periodo de máximo 92 días.» · «El tipo y el módulo son
        palabras sin espacios (p. ej. usuario_editado o usuarios).»
      security:
        - sesionGateway: []
      parameters:
        - $ref: '#/components/parameters/LogsDesde'
        - $ref: '#/components/parameters/LogsHasta'
        - $ref: '#/components/parameters/LogsUsuarioId'
        - $ref: '#/components/parameters/LogsOperacion'
        - $ref: '#/components/parameters/LogsTexto'
        - $ref: '#/components/parameters/LogsModulo'
        - $ref: '#/components/parameters/LogsTipo'
        - name: despuesFecha
          in: query
          required: false
          description: '`siguiente.fecha` de la página anterior (ISO 8601 con zona, tal cual se recibió).'
          schema: {type: string}
        - name: despuesId
          in: query
          required: false
          description: '`siguiente.id` de la página anterior.'
          schema: {type: integer, format: int64}
      responses:
        '200':
          description: Una página de registros.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginaLogs'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermisoLogs'
        '422':
          $ref: '#/components/responses/ValidacionLogs'
  /api/logs/exportar:
    get:
      tags: [logs]
      operationId: exportarLogs
      summary: Descargar los logs en Excel o CSV
      description: |
        Igual que el monolito. Exporta los mismos filtros que `GET /api/logs`, sin paginar. El archivo se llama
        `logs_auditoria_yyyyMMdd_HHmm.xlsx` o `.csv` (hora de Bogotá) y va como adjunto (`Content-Disposition: attachment`).

        Lleva un encabezado con el título «Logs de auditoría», la fecha de generación, quién lo generó y los filtros (`Periodo`,
        `Usuario (id)`, `Operación`, `Texto`, `Módulo`, `Tipo`). Las columnas son `Fecha y hora`, `Usuario`, `Operación`, `Tipo`,
        `Detalle`, `IP` y `Cambios (antes → después)`.

        Un reporte incompleto no se entrega: con más de 200 000 registros responde 422 «El periodo tiene más de 200000 registros.
        Acótelo (fechas, usuario u operación) y exporte de nuevo.»
      security:
        - sesionGateway: []
      parameters:
        - $ref: '#/components/parameters/LogsDesde'
        - $ref: '#/components/parameters/LogsHasta'
        - $ref: '#/components/parameters/LogsUsuarioId'
        - $ref: '#/components/parameters/LogsOperacion'
        - $ref: '#/components/parameters/LogsTexto'
        - $ref: '#/components/parameters/LogsModulo'
        - $ref: '#/components/parameters/LogsTipo'
        - name: formato
          in: query
          required: false
          description: '`xlsx` (por defecto) o `csv`.'
          schema:
            type: string
            enum: [xlsx, csv]
            default: xlsx
      responses:
        '200':
          description: El archivo.
          headers:
            Content-Disposition:
              description: '`attachment; filename="logs_auditoria_yyyyMMdd_HHmm.xlsx"` (o `.csv`).'
              schema: {type: string}
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: {type: string, format: binary}
            text/csv:
              schema: {type: string, format: binary}
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermisoLogs'
        '422':
          $ref: '#/components/responses/ValidacionLogs'
  /api/logs/enviar:
    post:
      tags: [logs]
      operationId: enviarLogs
      summary: Enviar los logs por correo
      description: |
        Igual que el monolito. Genera el mismo archivo que `GET /api/logs/exportar`, con los filtros del cuerpo, y lo envía adjunto a
        `para`. Responde 200 «Reporte enviado a <para>.» y deja en la bitácora `reporte_enviado`, con el correo enmascarado.

        422: «Escriba un correo válido para enviar el reporte.» · «Los reportes solo se envían a correos de: <dominios>.» · los mismos
        de los filtros y del tope de 200 000 registros. 502: «No se pudo enviar el correo: <error>».
      security:
        - sesionGateway: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnvioLogs'
      responses:
        '200':
          $ref: '#/components/responses/ConMensaje'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermisoLogs'
        '419':
          $ref: '#/components/responses/PaginaExpirada'
        '422':
          $ref: '#/components/responses/ValidacionLogs'
        '502':
          description: "«No se pudo enviar el correo: <error>»"
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problema'
  /interno/sesiones/{sid}:
    get:
      tags: [interno]
      operationId: estadoSesionInterno
      summary: Estado de una sesión (solo el gateway)
      description: |
        **Solo red interna.** El gateway lo consulta en cada petición `/api/**` (con caché de 30 s como máximo) y cierra su sesión si la
        respuesta no es vigente, con el `motivo` y el `mensaje` del 401 (tabla del encabezado). Revisa, en el orden de `FiltroSesion` del
        monolito: usuario inactivo, contraseña cambiada después del inicio, sesión cerrada (por salida, el administrador, otro ingreso o
        bloqueo), contraseña vencida y cambio exigido (este último envía el enlace). La inactividad la mide el gateway con `minutos` y la
        informa con `cerrar`. Consultar el estado no cuenta como actividad. Token de máquina con el alcance `seguridad:sesiones`.
      security:
        - maquina: [seguridad:sesiones]
      parameters:
        - $ref: '#/components/parameters/Sid'
      responses:
        '200':
          description: Estado (vigente o no, con su motivo).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EstadoInterno'
        '401':
          description: Sin token de máquina.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problema'
        '403':
          description: Token sin el alcance `seguridad:sesiones`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problema'
  /interno/sesiones/{sid}/actividad:
    post:
      tags: [interno]
      operationId: actividadSesionInterno
      summary: Actividad de una sesión (solo el gateway)
      description: |
        **Solo red interna.** El gateway informa la actividad como máximo cada 30 s; con ella `seguridad` decide si un ingreso nuevo del
        mismo usuario se rechaza (decisión 7.1: una sola sesión activa). Nunca mueve la actividad hacia atrás.
      security:
        - maquina: [seguridad:sesiones]
      parameters:
        - $ref: '#/components/parameters/Sid'
      responses:
        '204':
          description: Registrada (o la sesión ya estaba cerrada).
        '401':
          description: Sin token de máquina.
        '403':
          description: Token sin el alcance `seguridad:sesiones`.
  /interno/sesiones/{sid}/cerrar:
    post:
      tags: [interno]
      operationId: cerrarSesionInterno
      summary: Cerrar una sesión (solo el gateway)
      description: |
        **Solo red interna.** Cierra la sesión y revoca sus autorizaciones (refresh token) y la sesión del emisor. Lo usa el gateway al
        salir (`salida`) y al vencer la inactividad (`inactividad`). Idempotente.
      security:
        - maquina: [seguridad:sesiones]
      parameters:
        - $ref: '#/components/parameters/Sid'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CierreInterno'
      responses:
        '204':
          description: Cerrada (o ya lo estaba).
        '401':
          description: Sin token de máquina.
        '403':
          description: Token sin el alcance `seguridad:sesiones`.
        '422':
          description: Motivo no válido.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problema'
components:
  securitySchemes:
    sesionGateway:
      $ref: './comun.yaml#/components/securitySchemes/sesionGateway'
    maquina:
      type: oauth2
      description: Token de máquina (client_credentials) emitido por `seguridad`; la audiencia es el servicio del alcance.
      flows:
        clientCredentials:
          tokenUrl: /oauth2/token
          scopes:
            'seguridad:sesiones': Consultar, informar actividad y cerrar sesiones (gateway).
  parameters:
    IdUsuario:
      name: id
      in: path
      required: true
      schema: {type: integer, format: int64}
    IdPerfil:
      name: id
      in: path
      required: true
      description: Id del perfil o del rol adicional.
      schema: {type: integer, format: int32}
    LogsDesde:
      name: desde
      in: query
      required: false
      description: Primer día, `yyyy-MM-dd` (hora de Bogotá). Sin él, hoy menos 7 días.
      schema: {type: string, format: date}
    LogsHasta:
      name: hasta
      in: query
      required: false
      description: Último día, incluido, `yyyy-MM-dd`. Sin él, hoy.
      schema: {type: string, format: date}
    LogsUsuarioId:
      name: usuarioId
      in: query
      required: false
      description: Id del usuario (de `opciones.usuarios`).
      schema: {type: integer, format: int64}
    LogsOperacion:
      name: operacion
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/OperacionLog'
    LogsTexto:
      name: texto
      in: query
      required: false
      description: Busca en el detalle. Con texto, el periodo es de máximo 92 días.
      schema: {type: string, maxLength: 80}
    LogsModulo:
      name: modulo
      in: query
      required: false
      description: Exacto (de `opciones.modulos`). Se pasa a minúsculas y debe cumplir `^[a-z0-9_.-]{1,50}$`.
      schema: {type: string, maxLength: 50}
    LogsTipo:
      name: tipo
      in: query
      required: false
      description: Exacto, p. ej. `usuario_editado`. Se pasa a minúsculas y debe cumplir `^[a-z0-9_.-]{1,50}$`.
      schema: {type: string, maxLength: 50}
    Sid:
      name: sid
      in: path
      required: true
      description: Id de la sesión (claim `sid` del token).
      schema:
        type: string
        format: uuid
  # Las mismas respuestas de comun.yaml, declaradas aquí sobre el alias Problema para que el código generado no invente modelos.
  responses:
    SinPermiso:
      description: «No tiene permiso para esta acción.» (la pantalla USUARIOS es solo del Administrador).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
    SinPermisoLogs:
      description: «No tiene permiso para esta acción.» (la pantalla LOGS es solo del Administrador).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
    ValidacionLogs:
      description: Filtros, página, tope de exportación o correo no válidos (textos del monolito en cada operación).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
    ConMensaje:
      description: Hecho; el texto para mostrar va en `mensaje`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Mensaje'
    NoExisteUsuario:
      description: «El usuario no existe.»
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
    NoExisteRol:
      description: «El rol no existe.»
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
    ValidacionUsuario:
      description: Datos no válidos (textos del monolito; `campo` cuando aplica). Ver `DatosUsuario`.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
    ValidacionRol:
      description: |
        «El nombre del rol debe tener de 3 a 60 caracteres.» · «La descripción tiene máximo 200 caracteres.» · «Ya existe un perfil o rol
        con ese nombre.» · «Hay una pantalla no válida.» · «El perfil base no es válido: un rol adicional no deriva del Administrador ni
        del Auditor.» · «Marque al menos una pantalla para el rol.» · «La pantalla «X» no es del perfil base Y.» · «El perfil base de un rol
        no se cambia: cambiaría el alcance de sus usuarios. Cree otro rol.»
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
    NoAutenticado:
      description: |
        Sin sesión o sesión cerrada; el `motivo` dice por qué (tabla del encabezado). `sin_sesion` = «La sesión expiró. Vuelva a iniciar
        sesión.»
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
    PaginaExpirada:
      description: CSRF ausente o inválido (lo aplica el gateway). «La página expiró. Recárguela e intente de nuevo.»
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
    FormatoInvalido:
      description: «La petición no tiene el formato esperado.»
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
    DemasiadasPeticiones:
      description: Límite de tasa superado.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
  schemas:
    # Alias de los comunes: así el código generado los llama Problema y Mensaje (y no Ingresar400Response...).
    Problema:
      $ref: './comun.yaml#/components/schemas/Problema'
    Mensaje:
      $ref: './comun.yaml#/components/schemas/Mensaje'
    Inicio:
      type: object
      required: [captchaDesactivado, csrf]
      properties:
        captchaSitio:
          type: [string, 'null']
          description: Clave pública de sitio de Cloudflare Turnstile. En local y en e2e, la clave de prueba pública que documenta Cloudflare.
        captchaDesactivado:
          type: boolean
          description: true solo en local sin clave configurada (la SPA no muestra el widget).
        csrf:
          type: string
          description: Nombre de la cabecera CSRF.
          examples: [X-XSRF-TOKEN]
    Ingreso:
      type: object
      required: [usuario, clave]
      properties:
        usuario:
          type: string
          maxLength: 50
        clave:
          type: string
          maxLength: 200
          format: password
        captcha:
          type: [string, 'null']
          description: Respuesta del widget Turnstile.
    Paso:
      type: object
      required: [paso, mensaje]
      properties:
        paso:
          type: string
          enum: [codigo, definir_clave, cambiar_clave]
        mensaje:
          type: string
        correo:
          type: [string, 'null']
          description: Correo del usuario enmascarado (p. ej. `ana***@seguridad.prueba.local`).
        enlaceLocal:
          type: [string, 'null']
          description: Se conserva por compatibilidad con el monolito; siempre `null` (el enlace se lee del correo).
    Codigo:
      type: object
      required: [codigo]
      properties:
        codigo:
          type: string
          maxLength: 10
          description: Los 6 dígitos del correo (se ignoran los espacios de los extremos).
    IngresoCompleto:
      type: object
      required: [usuario, nombre, continuar]
      properties:
        usuario:
          type: string
        nombre:
          type: string
        continuar:
          type: string
          description: |
            URL relativa al origen (siempre empieza por `/`) de la autorización OIDC pendiente. Si el ingreso no vino del gateway, es
            `/bff/oauth2/authorization/lume`. La SPA navega con `window.location.assign(continuar)`.
          examples: ['/oauth2/authorize?response_type=code&client_id=gateway&...']
    CambioInicial:
      type: object
      required: [clave]
      properties:
        clave:
          type: string
          maxLength: 200
          format: password
        confirmacion:
          type: [string, 'null']
          format: password
    Olvide:
      type: object
      required: [valor]
      properties:
        valor:
          type: string
          maxLength: 150
          description: Usuario o correo.
        captcha:
          type: [string, 'null']
    ConsultaEnlace:
      type: object
      required: [tkn]
      properties:
        tkn:
          type: string
          maxLength: 64
          description: Token del enlace (64 caracteres hexadecimales). En la base solo se guarda su SHA-256.
    EnlaceClave:
      type: object
      required: [valido]
      properties:
        valido:
          type: boolean
        nombre:
          type: string
          description: Solo si `valido`.
        mensaje:
          type: string
          description: Solo si no es válido.
    NuevaClave:
      type: object
      description: |
        Política de claves (`reglas/Claves`): «La contraseña debe tener mínimo 12 caracteres.» · «La contraseña no puede tener ñ ni
        tildes.» · «La contraseña debe tener máximo 64 caracteres.» · «La contraseña debe tener mayúsculas y minúsculas.» · «La
        contraseña debe tener al menos un número.» · «La contraseña debe tener al menos un carácter especial.»
      required: [tkn, clave]
      properties:
        tkn:
          type: string
          maxLength: 64
        clave:
          type: string
          maxLength: 200
          format: password
        confirmacion:
          type: [string, 'null']
          format: password
    CambioClave:
      type: object
      required: [actual, clave]
      properties:
        actual:
          type: string
          maxLength: 200
          format: password
        clave:
          type: string
          maxLength: 200
          format: password
        confirmacion:
          type: [string, 'null']
          format: password
    EntradaMenu:
      type: object
      required: [ruta, titulo, grupo]
      properties:
        ruta:
          type: string
          examples: [agenda]
        titulo:
          type: string
        grupo:
          type: string
          description: Cadena vacía si no tiene grupo.
    Sesion:
      type: object
      required: [id, usuario, nombre, perfiles, menu, pantallas, minutosInactividad]
      properties:
        id:
          type: integer
          format: int64
          description: El mismo id numérico del monolito.
        usuario:
          type: string
        nombre:
          type: string
        perfiles:
          type: array
          items:
            type: string
        menu:
          type: array
          items:
            $ref: '#/components/schemas/EntradaMenu'
        pantallas:
          type: array
          items:
            type: string
        minutosInactividad:
          type: integer
          format: int32
          minimum: 1
          maximum: 480
    EstadoSesion:
      type: object
      required: [minutos, restantes]
      properties:
        minutos:
          type: integer
          format: int32
        restantes:
          type: integer
          format: int64
          description: Segundos que le quedan a la sesión antes de cerrarse por inactividad.
    Minutos:
      type: object
      required: [minutos]
      properties:
        minutos:
          type: integer
          format: int32
    FilaUsuario:
      type: object
      required: [id, nombre, usuario, correo, activo, bloqueado, sesionAbierta, claveInicial, perfiles]
      properties:
        id: {type: integer, format: int64}
        nombre: {type: string}
        documento: {type: [string, 'null']}
        telefono: {type: [string, 'null']}
        usuario: {type: string}
        correo: {type: string}
        activo: {type: boolean}
        ultimoIngreso: {type: [string, 'null'], description: 'yyyy-MM-dd HH:mm, hora de Bogotá'}
        bloqueado: {type: boolean}
        sesionAbierta: {type: boolean}
        claveInicial: {type: boolean}
        perfiles: {type: array, items: {type: integer, format: int32}, description: Ids asignados (perfiles base y roles adicionales).}
        alcanceFuerza: {type: [string, 'null']}
        alcancePunto: {type: [integer, 'null'], format: int64}
        alcanceRegional: {type: [integer, 'null'], format: int64}
    PerfilAsignable:
      type: object
      required: [id, nombre]
      properties:
        id: {type: integer, format: int32}
        nombre: {type: string}
        descripcion: {type: [string, 'null']}
        baseId: {type: [integer, 'null'], format: int32, description: Solo en los roles adicionales.}
    PuntoEsm:
      type: object
      required: [id, nombre]
      properties:
        id: {type: integer, format: int64}
        nombre: {type: string}
        sigla: {type: [string, 'null']}
        fuerza: {type: [string, 'null']}
    Regional:
      type: object
      required: [id, nombre]
      properties:
        id: {type: integer, format: int64}
        nombre: {type: string}
    Fuerza:
      type: object
      required: [codigo, nombre]
      properties:
        codigo: {type: string, enum: [EJC, ARC, FAC]}
        nombre: {type: string}
    ListaUsuarios:
      type: object
      required: [usuarios, perfiles, puntos, regionales, fuerzas]
      properties:
        usuarios: {type: array, items: {$ref: '#/components/schemas/FilaUsuario'}}
        perfiles: {type: array, items: {$ref: '#/components/schemas/PerfilAsignable'}}
        puntos: {type: array, items: {$ref: '#/components/schemas/PuntoEsm'}}
        regionales: {type: array, items: {$ref: '#/components/schemas/Regional'}}
        fuerzas: {type: array, items: {$ref: '#/components/schemas/Fuerza'}}
    DatosUsuario:
      type: object
      description: |
        Validaciones del monolito (`ServicioUsuarios.guardar`), todas 422 con `campo` cuando aplica: nombre de 3 a 150; usuario
        `^[a-z0-9._-]{3,50}$`; correo válido; documento y teléfono máximo 30; teléfono móvil colombiano (+57 y 10 dígitos que empiezan por
        3); al menos un perfil; combinaciones válidas; documento obligatorio para Auditor; fuerza para Sanidad; ESM activo para ESM;
        regional activa para OPL regional; usuario y correo únicos; no quitarse a sí mismo el perfil Administrador.
      properties:
        nombre: {type: [string, 'null']}
        documento: {type: [string, 'null']}
        telefono: {type: [string, 'null']}
        usuario: {type: [string, 'null']}
        correo: {type: [string, 'null']}
        perfiles: {type: [array, 'null'], items: {type: integer, format: int32}}
        alcanceFuerza: {type: [string, 'null']}
        alcancePunto: {type: [integer, 'null'], format: int64}
        alcanceRegional: {type: [integer, 'null'], format: int64}
        claveInicial: {type: [string, 'null'], format: password, description: Solo al crear. Si viene, cumple la política de claves.}
    UsuarioGuardado:
      type: object
      required: [id, creado, correoOk, mensaje]
      properties:
        id: {type: integer, format: int64}
        creado: {type: boolean}
        correoOk: {type: boolean}
        mensaje: {type: string}
        enlaceLocal: {type: [string, 'null'], description: Siempre null (compatibilidad con el monolito).}
    EstadoActivo:
      type: object
      required: [activo]
      properties:
        activo: {type: boolean}
    ClaveInicialNueva:
      type: object
      properties:
        clave: {type: [string, 'null'], format: password}
    ParametrosSeguridad:
      type: object
      required: [minutosSesion, minutosMaximo]
      properties:
        minutosSesion: {type: integer, format: int32}
        minutosMaximo: {type: integer, format: int32}
    CambioSeguridad:
      type: object
      properties:
        minutosSesion: {type: [integer, 'null'], format: int32}
    PantallaElegible:
      type: object
      required: [codigo, titulo]
      properties:
        codigo: {type: string, description: Constante de reglas/Pantallas (p. ej. RIESGO).}
        titulo: {type: string}
    BaseRol:
      type: object
      required: [id, nombre, pantallas]
      properties:
        id: {type: integer, format: int32}
        nombre: {type: string}
        pantallas: {type: array, items: {$ref: '#/components/schemas/PantallaElegible'}}
    RolAdicional:
      type: object
      required: [id, nombre, baseId, activo, pantallas, usuarios]
      properties:
        id: {type: integer, format: int32}
        nombre: {type: string}
        descripcion: {type: [string, 'null']}
        baseId: {type: integer, format: int32}
        activo: {type: boolean}
        pantallas: {type: array, items: {type: string}}
        usuarios: {type: integer, format: int64, description: Usuarios activos que lo tienen asignado.}
    CatalogoRoles:
      type: object
      required: [bases, roles]
      properties:
        bases: {type: array, items: {$ref: '#/components/schemas/BaseRol'}}
        roles: {type: array, items: {$ref: '#/components/schemas/RolAdicional'}}
    DatosRol:
      type: object
      properties:
        nombre: {type: [string, 'null']}
        descripcion: {type: [string, 'null']}
        baseId: {type: [integer, 'null'], format: int32}
        pantallas: {type: [array, 'null'], items: {type: string}}
    RolCreado:
      type: object
      required: [id, mensaje]
      properties:
        id: {type: integer, format: int32}
        mensaje: {type: string}
    NombrePerfil:
      type: object
      properties:
        nombre: {type: [string, 'null']}
        descripcion: {type: [string, 'null']}
    EstadoInterno:
      type: object
      required: [vigente, minutos]
      properties:
        vigente:
          type: boolean
        minutos:
          type: integer
          format: int32
          description: Minutos de inactividad vigentes (el gateway mide la inactividad con ellos).
        uid:
          type: [integer, 'null']
          format: int64
        motivo:
          type: [string, 'null']
          description: Si no es vigente, el `motivo` del 401 (tabla del encabezado).
          enum: [sin_sesion, inactividad, inactivo, clave, cerrada, reemplazada, clave_vencida, cambio_clave, bloqueado, null]
        mensaje:
          type: [string, 'null']
          description: Si no es vigente, el texto del 401.
    CierreInterno:
      type: object
      required: [motivo]
      properties:
        motivo:
          type: string
          enum: [salida, inactividad]
    OperacionLog:
      type: string
      description: |
        Operación de la bitácora. La pantalla muestra insercion → «Inserción», actualizacion → «Actualización», eliminacion →
        «Eliminación», consulta → «Consulta», ingreso → «Ingreso» y salida → «Salida».
      enum: [insercion, actualizacion, eliminacion, consulta, ingreso, salida]
    UsuarioLog:
      type: object
      required: [id, nombre, usuario]
      properties:
        id: {type: integer, format: int64}
        nombre: {type: string}
        usuario: {type: string}
    OpcionesLogs:
      type: object
      required: [operaciones, usuarios, modulos, correoDefecto]
      properties:
        operaciones:
          type: array
          items:
            $ref: '#/components/schemas/OperacionLog'
        usuarios:
          type: array
          items:
            $ref: '#/components/schemas/UsuarioLog'
        modulos:
          type: array
          description: Módulos que aparecen en la bitácora.
          items: {type: string}
        correoDefecto:
          type: string
          description: Correo sugerido para «Enviar por correo»; `""` si no hay.
    CambioLog:
      type: object
      required: [campo, oculto]
      properties:
        campo: {type: string}
        antes: {type: [string, 'null']}
        despues: {type: [string, 'null']}
        oculto:
          type: boolean
          description: |
            Dato personal (Ley 1581): no se guarda el valor y `antes` y `despues` son nulos. La pantalla muestra «Modificado (dato personal:
            no se guarda el valor, Ley 1581)». Si los cambios guardados no se pueden leer llega un único `{campo: "(cambios ilegibles)",
            oculto: true}`.
    FilaLog:
      type: object
      required: [id, fecha, fechaLlave, operacion, tipo, descripcion]
      properties:
        id: {type: integer, format: int64}
        fecha:
          type: string
          description: Hora de Bogotá, `yyyy-MM-dd HH:mm:ss`.
        fechaLlave:
          type: string
          description: El instante exacto (ISO 8601 con zona), para el cursor.
        usuario: {type: [string, 'null']}
        operacion:
          $ref: '#/components/schemas/OperacionLog'
        tipo:
          type: string
          description: P. ej. `usuario_editado` o `login`.
        modulo: {type: [string, 'null']}
        servicio:
          type: [string, 'null']
          description: Servicio que originó el registro (nuevo respecto al monolito; `null` en los registros migrados).
        descripcion: {type: string}
        ip: {type: [string, 'null']}
        cambios:
          type: [array, 'null']
          description: Antes y después de cada campo que cambió, o `null` si el registro no tiene cambios.
          items:
            $ref: '#/components/schemas/CambioLog'
    CursorLogs:
      type: object
      required: [fecha, id]
      properties:
        fecha:
          type: string
          description: Se envía tal cual como `despuesFecha`.
        id:
          type: integer
          format: int64
          description: Se envía como `despuesId`.
    PaginaLogs:
      type: object
      required: [filas, desde, hasta]
      properties:
        filas:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/FilaLog'
        siguiente:
          description: Cursor de la página siguiente, o `null` si no hay más.
          oneOf:
            - $ref: '#/components/schemas/CursorLogs'
            - type: 'null'
        desde:
          type: string
          format: date
          description: El periodo que se aplicó (ya normalizado).
        hasta:
          type: string
          format: date
    EnvioLogs:
      type: object
      required: [para]
      properties:
        desde: {type: [string, 'null'], format: date}
        hasta: {type: [string, 'null'], format: date}
        usuarioId: {type: [integer, 'null'], format: int64}
        operacion:
          oneOf:
            - $ref: '#/components/schemas/OperacionLog'
            - type: 'null'
        texto: {type: [string, 'null'], maxLength: 80}
        modulo: {type: [string, 'null'], maxLength: 50}
        tipo: {type: [string, 'null'], maxLength: 50}
        formato:
          type: [string, 'null']
          enum: [xlsx, csv, null]
          description: Por defecto `xlsx` (la pantalla siempre envía `xlsx`).
        para:
          type: string
          description: Correo de destino; solo de los dominios permitidos para reportes.
