        Errores parciales que se acumulan en «Revise el punto: …»: «el nombre debe tener de 3 a 200 caracteres» · «la unidad debe ser ESM,
        FA o NC» · «la fuerza no existe o está inactiva» (NC sin fuerza queda «NA») · «falta la modalidad del ESM (Dispensación,
        Suministro, Consignación o Satélite)» · «el municipio no existe» · «el municipio «se llega desde» no existe» · «la regional no existe
        o está inactiva» · «el auditor asignado no es un auditor activo» · «X tiene máximo N caracteres» (sigla 30, NIT 20, dirección 200,
        contacto 150, nivel 40, horario 200) · «el correo «X» no es válido» · «máximo 10 correos». La modalidad solo se guarda en ESM y el
        NIT solo en FA.
