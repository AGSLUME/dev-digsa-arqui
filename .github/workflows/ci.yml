# CI de LUME: build + pruebas del backend (Maven, con Testcontainers) y del frontend (Angular).
# Acciones fijadas por SHA de commit (ADR-012); la versión va en el comentario.
name: CI

on:
  push:
    branches: [main, develop, seguridad, angular-base, visitas-a, visitas-b, reportes]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (mvnw verify)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build y pruebas
        run: ./mvnw -B -ntp verify
      - name: Resumen de pruebas
        if: always()
        run: |
          for d in librerias/* servicios/*; do
            [ -d "$d/target/surefire-reports" ] || continue
            awk -F'[:,]' '/^Tests run/ {r+=$2; f+=$4; e+=$6} END {printf "%s: %d pruebas, %d fallos, %d errores\n", FILENAME, r, f, e}' \
              "$d"/target/surefire-reports/*.txt | sed "s|$d/target/surefire-reports/[^:]*|$d|" >> "$GITHUB_STEP_SUMMARY"
          done

  frontend:
    name: Frontend (ng build + ng test)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar (lockfile exacto)
        run: npm ci --no-audit --no-fund
      - name: Auditoría de dependencias de producción (aviso)
        run: npm audit --omit=dev || true
      - name: Build
        run: npx ng build
      - name: Pruebas
        run: npx ng test --watch=false
