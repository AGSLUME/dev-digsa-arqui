# Configuración de RabbitMQ para LUME (se monta en /etc/rabbitmq/conf.d/).
# Tope de mensaje: 256 KiB (los consumidores de librerias/comun ya rechazan cuerpos mayores; un evento es una foto, no un archivo).
max_message_size = 262144
# Exchanges de los publicadores declarados al arrancar (sin secretos): los permisos por tema de usuarios.sh exigen que existan antes
# de que cualquier servicio se conecte. Cada publicador los vuelve a declarar con los MISMOS argumentos (topic, durable,
# alternate-exchange <origen>.sin-ruta); su cola <origen>.sin-ruta la crea el propio publicador.
definitions.import_backend = local_filesystem
definitions.local.path = /etc/rabbitmq/definiciones.json
